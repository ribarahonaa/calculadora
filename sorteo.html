<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorteo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Bricolage+Grotesque:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/sorteo.css">
</head>
<body class="landing-body tool-page" data-page="sorteo">

<!-- Navbar + fondo de patitas: inyectados por js/chrome.js -->
<div id="slot-navbar"></div>
<div id="slot-paw-bg"></div>

<div class="shell">

  <h1>🎲 Sorteo</h1>
  <p class="subtitle">Pega tu lista de participantes (uno por línea), elige cuántos ganadores quieres y sortea con un solo clic.</p>

  <div class="sorteo-grid">
    <!-- Form -->
    <div class="card">
      <h2>Configuración</h2>
      <label for="participantes">Participantes</label>
      <textarea id="participantes" placeholder="Juan Pérez&#10;María González&#10;Pedro Soto&#10;..."></textarea>
      <div class="stats">
        <span id="conteo" aria-live="polite">0 participantes</span>
        <a href="#" id="cargarEjemplo">cargar ejemplo</a>
      </div>

      <div class="row row--mt">
        <div>
          <label for="nGanadores">Número de ganadores</label>
          <input type="number" id="nGanadores" min="1" value="1">
        </div>
        <div>
          <label for="titulo">Título (opcional)</label>
          <input type="text" id="titulo" placeholder="Sorteo de cumpleaños">
        </div>
      </div>

      <div class="check">
        <input type="checkbox" id="permitirRepetidos">
        <label for="permitirRepetidos">Permitir nombres duplicados (más entradas = más oportunidades)</label>
      </div>

      <div class="actions">
        <button class="btn-primary" id="sortear">🎲 Sortear ganadores</button>
        <button class="btn-secondary" id="mezclar">🔀 Mezclar</button>
        <button class="btn-danger" id="limpiar">🗑 Limpiar</button>
      </div>
      <div class="error hidden" id="error" role="alert"></div>
    </div>

    <!-- Results -->
    <div class="results empty" id="results"></div>
  </div>

  <!-- Modal ganadores con tombola integrada -->
  <div id="winnersModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Resultado del sorteo" aria-hidden="true">
    <div class="modal-backdrop"></div>
    <div class="modal-content modal-winners">
      <button class="modal-close" id="winnersClose" aria-label="Cerrar">✕</button>
      <div class="champion-modal-inner">
        <div class="trofeo-big" id="modalTrofeo">🎲</div>
        <div class="champion-label" id="winnersTitle">Sorteando...</div>
        <div class="rolling in-modal" id="modalTombola"></div>
        <div id="winnersModalList" class="winners-modal-list"></div>
        <div class="modal-error hidden" id="modalError" role="alert"></div>
        <div class="modal-actions" id="modalActions">
          <button class="btn-primary" id="winnersAgain">🎲 Sortear de nuevo</button>
          <button class="btn-secondary" id="winnersDismiss">Cerrar</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- FABs (Spotify + Redragon): inyectados por js/chrome.js -->
<div id="slot-fabs"></div>

<script src="js/utils.js"></script>
<script src="js/sorteo.js"></script>
<script src="js/chrome.js"></script>
<script src="js/landing.js"></script>
</body>
</html>
